# CTFd on https://CTF_HOST (and CTF_HOSTNAME if set). No host rule, so it
# answers for the bare IP too. Traefik serves our own certificate by default
# (TLSStore "default"), since browsers send no SNI when you type an IP.

apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: ctfd
spec:
  defaultCertificate:
    secretName: ctfd-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: ctfd
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Login brute-force guard on top of CTFd's own limits (per client IP).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: ctfd
spec:
  rateLimit:
    average: 20
    burst: 60
---
# http://… → https://…
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ctfd-http
  namespace: ctfd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: ctfd-redirect-https@kubernetescrd
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ctfd-service
            port: {number: 80}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ctfd-https
  namespace: ctfd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: ctfd-rate-limit@kubernetescrd
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ctfd-service
            port: {number: 80}
