# Challenge controller:
#   controller-api          CTFd plugin calls it to start/stop/status instances
#   controller-daemon       stops instances after INSTANCE_LIFETIME_MINUTES
#   controller-admin        dashboard backend (Admin → Platform in CTFd) and
#                           the deploy pipeline `make challenges` runs
#                           (push images, create team instances, flags, zips)
apiVersion: v1
kind: Service
metadata:
  name: controller-api
  namespace: ctfd
spec:
  selector: {app: controller-api}
  ports:
  - {name: http, port: 80, targetPort: 5000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-api
  namespace: ctfd
spec:
  replicas: 1
  selector:
    matchLabels: {app: controller-api}
  template:
    metadata:
      labels: {app: controller-api}
    spec:
      serviceAccountName: ctf-controller
      # Alpine (musl) gives up on a lookup if ANY search-domain query fails,
      # and the node's DHCP search domain (e.g. "localdomain") is forwarded
      # to the LAN's DNS, which may time out. ndots:2 makes full names like
      # ctfd-service.ctfd.svc.cluster.local resolve directly, no search list.
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      nodeSelector:
        ctf/role: core
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: controller-api
        image: ${REGISTRY}/controller:latest
        imagePullPolicy: Always
        # 2 workers is plenty for 20 teams. Keep it low: the per-team cap is
        # checked per request against Kubernetes, not shared memory.
        command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "5000", "--workers", "2"]
        env:
        - name: CTF_MASTER_SECRET
          valueFrom: {secretKeyRef: {name: ctfd-secrets, key: CTF_MASTER_SECRET}}
        - name: CONTROLLER_KEY
          valueFrom: {secretKeyRef: {name: controller-key, key: CONTROLLER_KEY}}
        - name: CHALLENGE_HOST
          value: "${CTF_HOST}"
        - name: MAX_ACTIVE_PER_TEAM
          value: "${MAX_ACTIVE_PER_TEAM}"
        - name: FLAG_PREFIX
          value: "${FLAG_PREFIX}"
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 192Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
        - name: manifests
          mountPath: /app/challenges/manifests
          readOnly: true
      volumes:
      - name: manifests
        configMap:
          name: challenge-manifests
          optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-daemon
  namespace: ctfd
spec:
  replicas: 1
  selector:
    matchLabels: {app: controller-daemon}
  template:
    metadata:
      labels: {app: controller-daemon}
    spec:
      serviceAccountName: ctf-daemon
      # Alpine (musl) gives up on a lookup if ANY search-domain query fails,
      # and the node's DHCP search domain (e.g. "localdomain") is forwarded
      # to the LAN's DNS, which may time out. ndots:2 makes full names like
      # ctfd-service.ctfd.svc.cluster.local resolve directly, no search list.
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      nodeSelector:
        ctf/role: core
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: controller-daemon
        image: ${REGISTRY}/controller:latest
        imagePullPolicy: Always
        command: ["python", "daemon.py"]
        env:
        - name: CTF_MASTER_SECRET
          valueFrom: {secretKeyRef: {name: ctfd-secrets, key: CTF_MASTER_SECRET}}
        - name: LIFETIME_MINUTES
          value: "${INSTANCE_LIFETIME_MINUTES}"
        - name: POLL_SECONDS
          value: "60"
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: controller-admin
  namespace: ctfd
spec:
  selector: {app: controller-admin}
  ports:
  - {name: http, port: 5001, targetPort: 5001}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-admin
  namespace: ctfd
spec:
  replicas: 1
  # One process holds the job queue, and the data volume is node-local
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: controller-admin}
  template:
    metadata:
      labels: {app: controller-admin}
    spec:
      serviceAccountName: ctf-provisioner
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      nodeSelector:
        ctf/role: core
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: controller-admin
        image: ${REGISTRY}/controller:latest
        imagePullPolicy: Always
        # Single worker on purpose: jobs and their progress live in memory
        command: ["uvicorn", "admin_api:app", "--host", "0.0.0.0", "--port", "5001", "--workers", "1"]
        env:
        - name: ADMIN_KEY
          valueFrom: {secretKeyRef: {name: controller-admin-key, key: ADMIN_KEY}}
        - name: CTF_MASTER_SECRET
          valueFrom: {secretKeyRef: {name: ctfd-secrets, key: CTF_MASTER_SECRET}}
        - name: FLAG_PREFIX
          value: "${FLAG_PREFIX}"
        - name: CTFD_URL
          value: http://ctfd-service.ctfd.svc.cluster.local
        - name: REGISTRY_PUSH
          value: "${CTF_HOST}:5000"
        - name: REGISTRY_USER
          valueFrom: {secretKeyRef: {name: registry-creds, key: REGISTRY_USER}}
        - name: REGISTRY_PASSWORD
          valueFrom: {secretKeyRef: {name: registry-creds, key: REGISTRY_PASSWORD}}
        - name: DATA_DIR
          value: /data
        ports:
        - containerPort: 5001
        readinessProbe:
          httpGet: {path: /health, port: 5001}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 5001}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 768Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: data, mountPath: /data}
        # Written by make ctfd-setup; read on every use, so no restart needed
        - {name: ctfd-token, mountPath: /secrets/ctfd, readOnly: true}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: platform-data}
      - name: ctfd-token
        secret: {secretName: ctfd-admin-token, optional: true}
---
# controller-admin → Kubernetes API, CTFd, and the registry (image pushes).
# Here and not in base/ because it needs CTF_HOST.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-admin-registry
  namespace: ctfd
spec:
  podSelector:
    matchLabels: {app: controller-admin}
  policyTypes: [Egress]
  egress:
  # Docker rewrites CTF_HOST:5000 to the registry container's address
  # (Docker's default bridge, 172.17.0.0/16) before the policy is checked,
  # so both have to be allowed.
  - to: [{ipBlock: {cidr: "${CTF_HOST}/32"}}, {ipBlock: {cidr: 172.17.0.0/16}}]
    ports: [{protocol: TCP, port: 5000}]
